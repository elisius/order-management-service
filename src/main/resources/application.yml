spring:
  application:
    name: order-management-service
  datasource:
    url: jdbc:h2:mem:orders;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 50

server:
  port: 8080

logging:
  level:
    root: INFO
    com.elisiuslegodi.orders: INFO
  pattern:
    correlation: "[%X{requestId:-}] "

app:
  security:
    username: ${API_USERNAME:admin}
    password: ${API_PASSWORD:admin123}
